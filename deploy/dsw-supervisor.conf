; Included by the DSW instance's existing Supervisor. No daemon restart is needed.
; Place at /etc/supervisor/conf.d/stmatengss-mooncake-bot.conf.
[program:stmatengss-mooncake-bot]
command=/root/mooncake-bot/.venv/bin/mooncake-bot serve --config /root/mooncake-bot/config.toml
directory=/root/stmatengss-Mooncake-bot
environment=PATH="/root/mooncake-bot/.venv/bin:/usr/local/bin:/usr/bin:/bin",LANG="C.UTF-8"
autostart=true
autorestart=true
startsecs=5
startretries=1000
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
umask=077
stdout_logfile=/root/mooncake-bot/data/serve.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
priority=900

[program:stmatengss-mooncake-tunnel]
command=/root/mooncake-bot/.venv/bin/mooncake-bot tunnel --config /root/mooncake-bot/config.toml
directory=/root/stmatengss-Mooncake-bot
environment=PATH="/root/mooncake-bot/.venv/bin:/usr/local/bin:/usr/bin:/bin",LANG="C.UTF-8"
autostart=true
autorestart=true
startsecs=5
startretries=1000
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=45
umask=077
stdout_logfile=/root/mooncake-bot/data/tunnel.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
priority=910

[program:stmatengss-mooncake-rsi]
command=/root/mooncake-bot/.venv/bin/mooncake-bot rsi --config /root/mooncake-bot/config.toml --rsi-config /root/mooncake-bot/rsi.json
directory=/root/stmatengss-Mooncake-bot
environment=PATH="/root/mooncake-bot/.venv/bin:/usr/local/bin:/usr/bin:/bin",LANG="C.UTF-8"
autostart=true
autorestart=true
startsecs=5
startretries=1000
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
umask=077
stdout_logfile=/root/mooncake-bot/data/rsi.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
priority=920
