[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mooncake-bot"
version = "0.3.0"
description = "Supervised Mooncake GitHub App reviews and bounded continuous improvement"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3", "jsonschema>=4.23,<5",
]

[project.urls]
Repository = "https://github.com/stmatengss/stmatengss-Mooncake-bot"
Issues = "https://github.com/stmatengss/stmatengss-Mooncake-bot/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pre-commit>=4,<5"]

[project.scripts]
mooncake-bot = "mooncake_bot.cli:main"

[tool.setuptools.packages.find]
include = ["mooncake_bot*"]

[tool.setuptools.package-data]
mooncake_bot = ["rsi_cases.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
